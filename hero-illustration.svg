<svg xmlns="http://www.w3.org/2000/svg" width="600" height="460" viewBox="0 0 600 460" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Illustration of a shop front with a smartphone showing Google and Instagram</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FBF7F0" />
      <stop offset="100%" stop-color="#F3E9DA" />
    </linearGradient>
  </defs>
  <rect width="600" height="460" fill="url(#sky)" />
  <!-- Shop front -->
  <rect x="60" y="220" width="240" height="160" rx="16" fill="#FFFFFF" stroke="#E3DCCC" stroke-width="2" />
  <rect x="100" y="250" width="60" height="100" rx="6" fill="#FF7A59" />
  <rect x="180" y="250" width="60" height="100" rx="6" fill="#2EC4B6" />
  <rect x="70" y="200" width="40" height="24" rx="4" fill="#1E1B4B" />
  <text x="90" y="216" font-family="Fredoka, sans-serif" font-weight="700" font-size="16" fill="#FFFFFF">[SHOP NAME]</text>
  <!-- Smartphone -->
  <rect x="300" y="130" width="150" height="260" rx="24" fill="#FFFFFF" stroke="#2B2545" stroke-width="4" />
  <rect x="315" y="145" width="120" height="230" rx="14" fill="#2B2545" />
  <!-- Google pin on phone -->
  <circle cx="375" cy="230" r="16" fill="#FF7A59" />
  <circle cx="375" cy="230" r="7" fill="#FBF7F0" />
  <!-- Instagram camera on phone -->
  <rect x="345" y="320" width="60" height="60" rx="10" fill="#1E1B4B" />
  <circle cx="375" cy="350" r="10" fill="#FBF7F0" />
  <circle cx="375" cy="350" r="3" fill="#1E1B4B" />
</svg>
